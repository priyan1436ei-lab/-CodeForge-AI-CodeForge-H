<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="auto" style="background: transparent;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#030610" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="archBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#10b981;#38bdf8" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#ec4899;#38bdf8;#a855f7;#ec4899" dur="14s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#060e1d" />
    </linearGradient>

    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e28" />
      <stop offset="100%" stop-color="#0c0716" />
    </linearGradient>

    <filter id="glowFilt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes wireFlow1 { 0% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 0; } }
    @keyframes wireFlow2 { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -60; } }
    @keyframes routerPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.8)); }
    }
    @keyframes nodePing { 0% { r: 5px; opacity: 1; } 100% { r: 16px; opacity: 0; } }

    .flow-wire-cyan { stroke-dasharray: 6 5; animation: wireFlow1 1.6s linear infinite; }
    .flow-wire-purple { stroke-dasharray: 6 5; animation: wireFlow1 2.0s linear infinite; }
    .flow-wire-emerald { stroke-dasharray: 6 5; animation: wireFlow1 1.4s linear infinite; }
    .ping-ring { animation: nodePing 2s cubic-bezier(0.1, 0.8, 0.2, 1) infinite; }
    .tech-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
    .tech-desc { font-family: 'SF Mono', 'Fira Code', Menlo, monospace; font-size: 11px; fill: #94a3b8; }
    .badge-mono { font-family: 'SF Mono', 'Fira Code', Menlo, monospace; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Frame Background -->
  <rect x="5" y="5" width="950" height="470" rx="18" fill="url(#archBg)" stroke="url(#archBorder)" stroke-width="1.8" />

  <!-- Top Title Bar -->
  <g transform="translate(40, 40)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="4" font-family="'SF Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1">
      CODEFORGE DUAL-TIER HYBRID ARCHITECTURE (LOCAL 6GB GATE ↔ 27B SFT)
    </text>
  </g>

  <!-- Central Router Node -->
  <g transform="translate(60, 230)">
    <!-- Input Line -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="#38bdf8" stroke-width="2.5" class="flow-wire-cyan" />
    
    <!-- User Input Pill -->
    <rect x="-40" y="-20" width="85" height="40" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="2" y="-3" font-family="-apple-system, sans-serif" font-size="10.5" fill="#38bdf8" font-weight="700" text-anchor="middle">USER</text>
    <text x="2" y="11" font-family="'SF Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">PROMPT</text>

    <!-- Dynamic Router Diamond -->
    <g transform="translate(100, 0)">
      <polygon points="0,-35 40,0 0,35 -40,0" fill="#0c1a30" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#38bdf8">
        <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" class="ping-ring" />
      <text x="0" y="-42" font-family="'SF Mono', monospace" font-size="10" fill="#7dd3fc" font-weight="700" text-anchor="middle">ROUTER</text>
      <text x="0" y="48" font-family="'SF Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">VRAM Gate</text>
    </g>
  </g>

  <!-- Router Routing Connectors -->
  <!-- Upper Path to Tier 1 -->
  <path d="M 200 230 L 250 145 L 290 145" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-wire-cyan" filter="url(#glowFilt)" />
  <text x="225" y="132" font-family="'SF Mono', monospace" font-size="9" fill="#38bdf8" font-weight="700">FAST PATH</text>

  <!-- Lower Path to Tier 2 -->
  <path d="M 200 230 L 250 325 L 290 325" fill="none" stroke="#c084fc" stroke-width="2.5" class="flow-wire-purple" filter="url(#glowFilt)" />
  <text x="222" y="342" font-family="'SF Mono', monospace" font-size="9" fill="#c084fc" font-weight="700">HIGH SFT</text>

  <!-- ==================== TIER 1 CONTAINER ==================== -->
  <g transform="translate(290, 75)">
    <rect x="0" y="0" width="620" height="150" rx="14" fill="url(#tier1Grad)" stroke="#38bdf8" stroke-width="1.6" />
    
    <!-- Tier Badge -->
    <rect x="18" y="16" width="180" height="24" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="28" cy="28" r="4" fill="#38bdf8" />
    <text x="38" y="32" class="badge-mono" fill="#7dd3fc">TIER 1: LOCAL RUNTIME</text>

    <text x="210" y="32" font-family="'SF Mono', monospace" font-size="11" fill="#34d399" font-weight="700">
      CodeForge-H (126.94M Hybrid DeltaNet) • RTX 3050 6GB • $0.00 Spend
    </text>

    <!-- Sub-Block 1: DeltaNet State Recurrence -->
    <g transform="translate(18, 55)">
      <rect x="0" y="0" width="185" height="75" rx="8" fill="#08101e" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <text x="12" y="22" class="tech-title" font-size="12">3x DeltaNet Layers</text>
      <text x="12" y="40" class="tech-desc">O(1) Recurrent State Space</text>
      <text x="12" y="55" class="tech-desc">S_t = β_t S_{t-1} + v_t k_t^T</text>
      <text x="12" y="68" font-family="'SF Mono', monospace" font-size="9" fill="#38bdf8">SwiGLU + RMSNorm</text>
    </g>

    <!-- Sub-Block 2: Attention & MTP Head -->
    <g transform="translate(215, 55)">
      <rect x="0" y="0" width="185" height="75" rx="8" fill="#08101e" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1" />
      <text x="12" y="22" class="tech-title" font-size="12">1x MHA + MTP Head</text>
      <text x="12" y="40" class="tech-desc">Exact Needle Attention</text>
      <text x="12" y="55" class="tech-desc">Multi-Token Speculative</text>
      <text x="12" y="68" font-family="'SF Mono', monospace" font-size="9" fill="#818cf8">2x Inference Speedup</text>
    </g>

    <!-- Sub-Block 3: Process Jail & AST Repair -->
    <g transform="translate(412, 55)">
      <rect x="0" y="0" width="190" height="75" rx="8" fill="#08101e" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
      <text x="12" y="22" class="tech-title" font-size="12">Process Sandbox Jail</text>
      <text x="12" y="40" class="tech-desc">Pytest Execution (30s)</text>
      <text x="12" y="55" class="tech-desc">Bounded AST Patch Repair</text>
      <text x="12" y="68" font-family="'SF Mono', monospace" font-size="9" fill="#34d399">48/48 (100% Green)</text>
    </g>
  </g>

  <!-- ==================== TIER 2 CONTAINER ==================== -->
  <g transform="translate(290, 255)">
    <rect x="0" y="0" width="620" height="150" rx="14" fill="url(#tier2Grad)" stroke="#c084fc" stroke-width="1.6" />

    <!-- Tier Badge -->
    <rect x="18" y="16" width="195" height="24" rx="6" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="1" />
    <circle cx="28" cy="28" r="4" fill="#c084fc" />
    <text x="38" y="32" class="badge-mono" fill="#e9d5ff">TIER 2: 27B SFT ADAPTER</text>

    <text x="225" y="32" font-family="'SF Mono', monospace" font-size="11" fill="#f472b6" font-weight="700">
      Target: 27B Coding LLM • QLoRA 4-bit NF4 • ChatML Assistant Masking
    </text>

    <!-- Sub-Block 1: QLoRA Adapter Configuration -->
    <g transform="translate(18, 55)">
      <rect x="0" y="0" width="185" height="75" rx="8" fill="#130920" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1" />
      <text x="12" y="22" class="tech-title" font-size="12">QLoRA NF4 Adapter</text>
      <text x="12" y="40" class="tech-desc">Rank=16 • Alpha=32</text>
      <text x="12" y="55" class="tech-desc">q,k,v,o,gate,up,down</text>
      <text x="12" y="68" font-family="'SF Mono', monospace" font-size="9" fill="#c084fc">14.8GB SFT Footprint</text>
    </g>

    <!-- Sub-Block 2: ChatML Assistant-Only Loss Masking -->
    <g transform="translate(215, 55)">
      <rect x="0" y="0" width="185" height="75" rx="8" fill="#130920" stroke="rgba(236, 72, 153, 0.35)" stroke-width="1" />
      <text x="12" y="22" class="tech-title" font-size="12">Assistant Masking</text>
      <text x="12" y="40" class="tech-desc">Ignore Prompt Tokens (-100)</text>
      <text x="12" y="55" class="tech-desc">Backprop Code Only</text>
      <text x="12" y="68" font-family="'SF Mono', monospace" font-size="9" fill="#ec4899">Zero Loss Degradation</text>
    </g>

    <!-- Sub-Block 3: Fill-In-The-Middle (FIM) PSM -->
    <g transform="translate(412, 55)">
      <rect x="0" y="0" width="190" height="75" rx="8" fill="#130920" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1" />
      <text x="12" y="22" class="tech-title" font-size="12">FIM Code Insertion</text>
      <text x="12" y="40" class="tech-desc">50.76% PSM Rate</text>
      <text x="12" y="55" class="tech-desc">&lt;PRE&gt; &lt;SUF&gt; &lt;MID&gt;</text>
      <text x="12" y="68" font-family="'SF Mono', monospace" font-size="9" fill="#f472b6">110k Infilling Tokens</text>
    </g>
  </g>

  <!-- Bottom Hardware & Cloud Budget Strip -->
  <g transform="translate(40, 428)">
    <text x="0" y="20" font-family="'SF Mono', monospace" font-size="11" fill="#64748b">
      HARDWARE AUDIT: <tspan fill="#34d399">AMD Ryzen 5 7235HS (8T)</tspan> • <tspan fill="#38bdf8">RTX 3050 Laptop (6GB VRAM)</tspan> • <tspan fill="#f59e0b">24GB DDR5 RAM</tspan> • CLOUD COST: <tspan fill="#10b981" font-weight="700">$0.00 / hr</tspan>
    </text>
  </g>
</svg>
