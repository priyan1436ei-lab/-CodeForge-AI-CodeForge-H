<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="auto" style="background: transparent;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#ec4899;#10b981;#38bdf8" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5">
        <animate attributeName="stop-color" values="#818cf8;#ec4899;#10b981;#38bdf8;#818cf8" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#ec4899;#10b981;#38bdf8;#818cf8;#ec4899" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes termBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes progressBarAnim {
      0% { width: 0px; }
      12% { width: 140px; }
      28% { width: 310px; }
      48% { width: 490px; }
      68% { width: 680px; }
      84% { width: 840px; }
      94%, 98% { width: 910px; }
      100% { width: 0px; }
    }
    @keyframes step1 {
      0% { opacity: 0; transform: translateY(3px); }
      3%, 94% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; }
    }
    @keyframes step2 {
      0%, 10% { opacity: 0; transform: translateY(3px); }
      14%, 94% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; }
    }
    @keyframes step3 {
      0%, 25% { opacity: 0; transform: translateY(3px); }
      29%, 94% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; }
    }
    @keyframes step4 {
      0%, 42% { opacity: 0; transform: translateY(3px); }
      46%, 94% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; }
    }
    @keyframes step5 {
      0%, 60% { opacity: 0; transform: translateY(3px); }
      64%, 94% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; }
    }
    @keyframes step6 {
      0%, 76% { opacity: 0; transform: translateY(3px); }
      80%, 94% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; }
    }
    @keyframes step7 {
      0%, 88% { opacity: 0; transform: translateY(3px); }
      91%, 94% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; }
    }

    .mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace; font-size: 13px; }
    .term-cursor { animation: termBlink 0.8s infinite; }
    .bar-line { animation: progressBarAnim 16s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .anim-step1 { animation: step1 16s infinite; }
    .anim-step2 { animation: step2 16s infinite; }
    .anim-step3 { animation: step3 16s infinite; }
    .anim-step4 { animation: step4 16s infinite; }
    .anim-step5 { animation: step5 16s infinite; }
    .anim-step6 { animation: step6 16s infinite; }
    .anim-step7 { animation: step7 16s infinite; }
  </style>

  <!-- Terminal Window Outer Frame -->
  <rect x="5" y="5" width="910" height="510" rx="14" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.8" />

  <!-- Terminal Top Header Bar -->
  <rect x="6" y="6" width="908" height="42" rx="13" fill="url(#headerGrad)" />
  <circle cx="28" cy="27" r="6" fill="#ef4444" />
  <circle cx="48" cy="27" r="6" fill="#f59e0b" />
  <circle cx="68" cy="27" r="6" fill="#10b981" />

  <!-- Header Title -->
  <text x="460" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    codeforge-agent — autonomous-loop — 127.0.0.1:8000
  </text>

  <!-- Pulsing Live Indicator -->
  <g transform="translate(810, 20)">
    <rect x="-10" y="-3" width="90" height="18" rx="9" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <circle cx="0" cy="6" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="10" font-family="-apple-system, sans-serif" font-size="9.5" fill="#34d399" font-weight="700" letter-spacing="0.5">LIVE LOOP</text>
  </g>

  <!-- Dynamic Progress Bar -->
  <rect x="6" y="47" width="0" height="2" fill="url(#progressGrad)" class="bar-line" />

  <!-- Terminal Body Content -->
  <g transform="translate(30, 80)" class="mono">
    <!-- Step 1: User Command Execution -->
    <g class="anim-step1">
      <text x="0" y="0">
        <tspan fill="#34d399" font-weight="700">priyan@codeforge-h</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~/projects</tspan><tspan fill="#94a3b8">$ </tspan><tspan fill="#f1f5f9">python -m cli.codeforge gen </tspan><tspan fill="#fbbf24">"Build an enterprise expense tracker API"</tspan>
      </text>
    </g>

    <!-- Step 2: Planning Phase -->
    <g class="anim-step2">
      <text x="0" y="32">
        <tspan fill="#38bdf8" font-weight="700">[1/5 PLANNER]</tspan>
        <tspan fill="#94a3b8"> Validating requirement schema... </tspan>
        <tspan fill="#34d399" font-weight="700">OK</tspan>
        <tspan fill="#64748b"> (FastAPI + Pydantic v2 + SQLite + JWT Auth)</tspan>
      </text>
    </g>

    <!-- Step 3: Multi-File Code Synthesis -->
    <g class="anim-step3">
      <text x="0" y="64">
        <tspan fill="#818cf8" font-weight="700">[2/5 SYNTHESIS]</tspan>
        <tspan fill="#94a3b8"> Synthesizing 9 multi-file project artifacts with AST security jail...</tspan>
      </text>
      <text x="24" y="88" fill="#64748b">├── backend/main.py, backend/models.py, backend/auth.py, backend/test_api.py</text>
      <text x="24" y="108" fill="#64748b">└── frontend/package.json, src/app/page.tsx, Dockerfile, docker-compose.yml</text>
    </g>

    <!-- Step 4: Process-Isolated Sandbox Testing -->
    <g class="anim-step4">
      <text x="0" y="142">
        <tspan fill="#f59e0b" font-weight="700">[3/5 SANDBOX]</tspan>
        <tspan fill="#94a3b8"> Spawning isolated test runner (timeout=30s, jail=workspace/proj-453988)...</tspan>
      </text>
      <text x="24" y="166">
        <tspan fill="#94a3b8">Running </tspan><tspan fill="#f1f5f9">pytest backend/test_api.py -v</tspan>
        <tspan fill="#64748b"> ... </tspan>
        <tspan fill="#f87171" font-weight="700">FAILED</tspan>
        <tspan fill="#64748b"> (AssertionError: 401 != 500 in test_auth_unauthorized)</tspan>
      </text>
    </g>

    <!-- Step 5: Bounded Self-Repair & Re-test -->
    <g class="anim-step5">
      <text x="0" y="204">
        <tspan fill="#ec4899" font-weight="700">[4/5 REPAIR]</tspan>
        <tspan fill="#94a3b8"> Bounded Self-Repair triggered </tspan>
        <tspan fill="#c084fc" font-weight="700">(Attempt 1/3)</tspan>
      </text>
      <text x="24" y="228" fill="#38bdf8">→ Analyzed traceback: Missing HTTPException(status_code=401) in backend/auth.py</text>
      <text x="24" y="248" fill="#34d399">→ Applied minimal unified AST patch to backend/auth.py (diff: +4 lines, -1 line)</text>
      <text x="24" y="268">
        <tspan fill="#94a3b8">→ Retesting sandbox: </tspan>
        <tspan fill="#34d399" font-weight="700">4 PASSED</tspan>
        <tspan fill="#64748b"> in 0.42s (100% test contract verified • 0 errors)</tspan>
      </text>
    </g>

    <!-- Step 6: Artifact Packaging & ZIP Export -->
    <g class="anim-step6">
      <text x="0" y="306">
        <tspan fill="#34d399" font-weight="700">[5/5 EXPORT]</tspan>
        <tspan fill="#94a3b8"> Packaging verified project bundle...</tspan>
      </text>
      <text x="24" y="330" fill="#38bdf8">✔ Exported ZIP: exports/expense-tracker-v1.0.0.zip (SHA-256: 7d4a9f...)</text>
      <text x="24" y="350" fill="#64748b">✔ Continuous improvement feedback loop updated: staged_corrections.jsonl</text>
    </g>

    <!-- Step 7: Completed Loop with Live Cursor -->
    <g class="anim-step7">
      <text x="0" y="392">
        <tspan fill="#34d399" font-weight="700">priyan@codeforge-h</tspan><tspan fill="#64748b">:</tspan><tspan fill="#38bdf8">~/projects</tspan><tspan fill="#94a3b8">$ </tspan><tspan fill="#38bdf8">curl -X GET http://127.0.0.1:8000/api/v1/projects/status</tspan>
        <tspan class="term-cursor" fill="#38bdf8">█</tspan>
      </text>
    </g>
  </g>
</svg>
